<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/db09709f66.js" crossorigin="anonymous"></script>
    <title>Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>
            Let's count
        </h1>
    </header>
    <section>
        <div id="data">
            <p>Start: <input type="number" name="start" id="sta"></p>
            <p>End: <input type="number" name="end" id="end"></p>
            <p>Step: <input type="number" name="step" id="ste"></p>
            <p><input type="button" value="Count" onclick="count()"></p>
        </div>
        <div id="res">
            Preparing to count
        </div>
    </section>
    <footer>
        <p> <i class="fa-regular fa-copyright"></i> Curso em Vídeo</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
