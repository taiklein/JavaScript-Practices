<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/db09709f66.js" crossorigin="anonymous"></script>
    <title>Multiplication Table</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>
            Multiplication Table
        </h1>
    </header>
    <section>
        <div>
            <p>Number: <input type="number" name="num" id="n">
            <input type="button" value="View" onclick="table()"></p>
        </div>
        <div>
            <select name="table" id="seltab">
                <option value="">Type a number above</option>
            </select>
        </div>
    </section>
    <footer>
        <p> <i class="fa-regular fa-copyright"></i> Curso em Vídeo</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
